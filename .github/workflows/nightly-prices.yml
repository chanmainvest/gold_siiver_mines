# Nightly refresh of the DuckDB price cache + static site rebuild.
#
# Runs once a day: pulls incremental daily bars from Yahoo Finance for every
# miner, the 12 ETFs and gold/silver spot into data/prices.duckdb, rebuilds
# index.html from data/webapp/*.json + the price cache, and pushes the result
# so GitHub Pages redeploys. Safe to re-run: the fetch is incremental and the
# build is deterministic. Manual runs via the "Run workflow" button.

name: Nightly price refresh

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install duckdb pandas

      - name: Fetch incremental price history
        run: python3 scripts/fetch_price_history.py --incremental

      - name: Rebuild static site
        run: python3 scripts/build_website.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prices.duckdb data/ticker_map.json index.html
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Nightly: refresh price history ($(date -u +%F))"
            git push
          fi
